services:
  security-mvp:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  opa:
    image: openpolicyagent/opa:1.5.1-static
    profiles: ["external-policy"]
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./opa/policies:/policies:ro
    ports:
      - "8181:8181"
